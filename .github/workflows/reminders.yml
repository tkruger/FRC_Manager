# Runs the hourly notification reminders (purchase nags, meetings, task digests,
# competition countdowns...). Needs two repository secrets:
#   APP_URL      e.g. https://frc-manager.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var in Vercel
# Does nothing until both are set. Safe to run more often: reminders are deduplicated.
name: Notification reminders

on:
  schedule:
    - cron: "5 * * * *" # every hour at :05
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger reminder job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/notifications"
