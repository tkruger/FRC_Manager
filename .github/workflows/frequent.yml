# Every 5 minutes: live competition updates (schedule, next match, results, alliance selection,
# awards) and each member's open tasks as a meeting starts. Uses the same APP_URL and CRON_SECRET
# repository secrets as the reminders job. Does nothing until both are set, and returns right away
# when nothing is on.
name: Frequent updates

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Competitions and meeting starts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/frequent"
